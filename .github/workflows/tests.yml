name: Tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mariadb]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: immov_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, zip, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund

      - name: Frontend bauen
        run: npm run build

      - name: Code-Stil (Pint)
        run: vendor/bin/pint --test

      - name: Tests
        env:
          DB_CONNECTION: ${{ matrix.db == 'mariadb' && 'mariadb' || 'sqlite' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ${{ matrix.db == 'mariadb' && 'immov_test' || ':memory:' }}
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
